/* ───── charts.jsx ───── */

// Lightweight inline SVG charts for Risparmio
// Exposed on window: Donut, Sparkline, BarsHorizontal, TrendLines, Heatmap

function Donut({ data, size = 168, stroke = 22, centerLabel, centerValue }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const cx = size / 2, cy = size / 2;
  let offset = 0;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke="rgba(255,255,255,0.05)" strokeWidth={stroke} />
        {data.map((d, i) => {
          const len = (d.value / total) * c;
          const seg = (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none"
              stroke={d.color} strokeWidth={stroke}
              strokeDasharray={`${len} ${c - len}`}
              strokeDashoffset={-offset}
              strokeLinecap="butt" />
          );
          offset += len + 2; // tiny gap
          return seg;
        })}
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex',
        flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{ fontSize: 11, color: '#8C8C99', letterSpacing: 0.6, textTransform: 'uppercase' }}>
          {centerLabel}
        </div>
        <div style={{ fontSize: 26, color: '#F5F5F7', fontWeight: 600, letterSpacing: -0.5, fontVariantNumeric: 'tabular-nums', marginTop: 2 }}>
          {centerValue}
        </div>
      </div>
    </div>
  );
}

function Sparkline({ values, width = 320, height = 56, color = '#7B61FF', fill = true }) {
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const step = width / (values.length - 1);
  const pts = values.map((v, i) => [i * step, height - 6 - ((v - min) / span) * (height - 14)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${width} ${height} L 0 ${height} Z`;
  const gid = 'spg-' + Math.random().toString(36).slice(2, 7);
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill && <path d={area} fill={`url(#${gid})`} />}
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map(([x, y], i) => i === pts.length - 1 && (
        <circle key={i} cx={x} cy={y} r="3.5" fill={color} stroke="#0A0A0F" strokeWidth="2" />
      ))}
    </svg>
  );
}

function BarsHorizontal({ data, max, height = 8 }) {
  // data: [{ label, value, color, emoji, sub }]
  const ceiling = max || Math.max(...data.map(d => d.value));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {data.map((d, i) => {
        const pct = Math.min(100, (d.value / ceiling) * 100);
        return (
          <div key={i}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 6 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                {d.emoji && <span style={{ fontSize: 14 }}>{d.emoji}</span>}
                <span style={{ color: '#F5F5F7', fontSize: 14, fontWeight: 500 }}>{d.label}</span>
                {d.sub && <span style={{ color: '#5C5C68', fontSize: 12 }}>{d.sub}</span>}
              </div>
              <span style={{ color: '#F5F5F7', fontSize: 14, fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>
                {d.right}
              </span>
            </div>
            <div style={{ height, background: 'rgba(255,255,255,0.05)', borderRadius: 999, overflow: 'hidden' }}>
              <div style={{
                width: pct + '%', height: '100%',
                background: d.color, borderRadius: 999,
                transition: 'width 600ms cubic-bezier(.2,.8,.2,1)',
              }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TrendLines({ data, width = 340, height = 140 }) {
  // data: [{ m, spese, entrate }]
  const pad = { top: 12, right: 12, bottom: 22, left: 12 };
  const W = width - pad.left - pad.right;
  const H = height - pad.top - pad.bottom;
  const max = Math.max(...data.flatMap(d => [d.spese, d.entrate])) * 1.1;
  const step = W / (data.length - 1);
  const toPts = (k) => data.map((d, i) => [pad.left + i * step, pad.top + H - (d[k] / max) * H]);
  const lineFor = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const ePts = toPts('entrate'), sPts = toPts('spese');
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {/* baseline */}
      {[0.25, 0.5, 0.75].map(p => (
        <line key={p} x1={pad.left} x2={width - pad.right}
          y1={pad.top + H * p} y2={pad.top + H * p}
          stroke="rgba(255,255,255,0.04)" strokeDasharray="2 4" />
      ))}
      {/* spese (filled area) */}
      <defs>
        <linearGradient id="tl-sp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#FF6B6B" stopOpacity="0.22" />
          <stop offset="100%" stopColor="#FF6B6B" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="tl-en" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#3DDC97" stopOpacity="0.22" />
          <stop offset="100%" stopColor="#3DDC97" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={lineFor(sPts) + ` L ${pad.left + W} ${pad.top + H} L ${pad.left} ${pad.top + H} Z`} fill="url(#tl-sp)" />
      <path d={lineFor(ePts) + ` L ${pad.left + W} ${pad.top + H} L ${pad.left} ${pad.top + H} Z`} fill="url(#tl-en)" />
      <path d={lineFor(sPts)} fill="none" stroke="#FF6B6B" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      <path d={lineFor(ePts)} fill="none" stroke="#3DDC97" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
      {/* dots on last */}
      {[['#FF6B6B', sPts.at(-1)], ['#3DDC97', ePts.at(-1)]].map(([c, p], i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="4" fill={c} stroke="#0A0A0F" strokeWidth="2" />
      ))}
      {/* x labels */}
      {data.map((d, i) => (
        <text key={i} x={pad.left + i * step} y={height - 4}
          textAnchor="middle" fontSize="10" fill="#5C5C68"
          fontFamily="-apple-system, system-ui">{d.m}</text>
      ))}
    </svg>
  );
}

Object.assign(window, { Donut, Sparkline, BarsHorizontal, TrendLines });

const T = {
  bg:           '#0A0A0F',
  surface:      '#15151D',
  surfaceUp:    '#1E1E28',
  surfaceHover: '#23232E',
  border:       'rgba(255,255,255,0.07)',
  borderStrong: 'rgba(255,255,255,0.13)',
  text:         '#F5F5F7',

  warn:         '#F59E0B',
};

const eur = (n, opts = {}) => {
  const sign = opts.signed ? (n > 0 ? '+' : n < 0 ? '−' : '') : '';
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('it-IT', {
    minimumFractionDigits: opts.noDecimals ? 0 : 2,
    maximumFractionDigits: opts.noDecimals ? 0 : 2,
  });
  return `${sign}${formatted}\u00a0€`;
};

const parseDateIt = (iso) => {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const fmtDay = (iso) => {
  const d = parseDateIt(iso);
  const months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  return `${d.getDate()} ${months[d.getMonth()]}`;
};
const fmtDayLabel = (iso) => {
  const d = parseDateIt(iso);
  const today = new Date(2026, 2, 25); // Mar 25
  const days = Math.round((today - d) / 86400000);
  if (days === 0) return 'Oggi';
  if (days === 1) return 'Ieri';
  const wd = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'][d.getDay()];
  return `${wd} ${fmtDay(iso)}`;
};

function Card({ children, style, padding = 18, onClick, interactive }) {
  return (
    <div onClick={onClick} style={{
      background: T.surface,
      borderRadius: 22,
      border: `1px solid ${T.border}`,
      padding,
      cursor: onClick || interactive ? 'pointer' : 'default',
      transition: 'background 160ms, transform 160ms',
      ...style,
    }}
      onMouseEnter={e => { if (onClick || interactive) e.currentTarget.style.background = T.surfaceUp; }}
      onMouseLeave={e => { if (onClick || interactive) e.currentTarget.style.background = T.surface; }}>
      {children}
    </div>
  );

      </div>

      {/* Bottom nav */}
      <BottomNav active={screen} goTo={goTo} openAdd={() => setAdding(true)} />

      {/* Add transaction sheet */}
      <AddTransactionSheet open={adding} onClose={() => setAdding(false)} />
    </div>
  );
}

Object.assign(window, { App, AddTransactionSheet, BottomNav });


/* ───── bootstrap ───── */
(function () {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  let appAPI = null;
  function Wrap() {
    const [s, setS] = React.useState('home');
    const [adding, setAdding] = React.useState(false);
    appAPI = { goTo: setS, openAdd: () => setAdding(true) };
    const scrollRef = React.useRef(null);
    const screens = {
      home:         React.createElement(HomeScreen,         { goTo: setS, openAdd: () => setAdding(true) }),
      transactions: React.createElement(TransactionsScreen, { goTo: setS, openAdd: () => setAdding(true) }),
      stats:        React.createElement(StatsScreen,        { goTo: setS }),
      goals:        React.createElement(GoalsScreen,        { goTo: setS }),
      profile:      React.createElement(ProfileScreen,      { goTo: setS }),
    };
    React.useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [s]);
    React.useEffect(() => {
      document.querySelectorAll('#navLinks button').forEach(b => {
        b.classList.toggle('active', b.dataset.goto === s);
      });
    }, [s]);

    return (
      <div data-screen-label={`app-${s}`} style={{ width:'100%', height:'100%', background:T.bg, position:'relative', overflow:'hidden' }}>
        <div ref={scrollRef} style={{ position:'absolute', inset:0, paddingTop:56, overflowY:'auto', overflowX:'hidden' }}>
          {screens[s]}

        <div style={{
          position:'absolute', top:0, left:0, right:0, height:56,
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'18px 28px 0 32px', color:T.text, fontSize:15, fontWeight:600,
          background:'linear-gradient(180deg, rgba(10,10,15,0.95) 30%, rgba(10,10,15,0))',
          zIndex:50, pointerEvents:'none',
        }}>
          <span style={{ fontVariantNumeric:'tabular-nums' }}>9:41</span>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="0.7"/><rect x="4.5" y="4" width="3" height="7" rx="0.7"/><rect x="9" y="2" width="3" height="9" rx="0.7"/><rect x="13.5" y="0" width="3" height="11" rx="0.7"/></svg>
            <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 3C9.5 3 11.4 3.8 12.8 5.2L13.8 4.2C12 2.4 9.8 1.4 7.5 1.4C5.2 1.4 3 2.4 1.2 4.2L2.2 5.2C3.6 3.8 5.5 3 7.5 3Z"/><path d="M7.5 6.2C8.7 6.2 9.8 6.6 10.6 7.4L11.5 6.5C10.4 5.4 9 4.8 7.5 4.8C6 4.8 4.6 5.4 3.5 6.5L4.4 7.4C5.2 6.6 6.3 6.2 7.5 6.2Z"/><circle cx="7.5" cy="9.2" r="1.3"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" strokeOpacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><path d="M23 4v4c0.6-0.2 1-0.9 1-2s-0.4-1.8-1-2z" fill="currentColor" fillOpacity="0.5"/></svg>
          </div>
        </div>
        <BottomNav active={s} goTo={setS} openAdd={() => setAdding(true)} />
        <AddTransactionSheet open={adding} onClose={() => setAdding(false)} />
      </div>
    );
  }
  root.render(<Wrap />);

  document.getElementById('navLinks').addEventListener('click', e => {
    const b = e.target.closest('button[data-goto]');
    if (!b || !appAPI) return;
    if (b.dataset.goto === '__add') appAPI.openAdd(); else appAPI.goTo(b.dataset.goto);
  });
})();

</script>
